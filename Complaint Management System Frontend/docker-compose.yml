# Frontend stack (Nginx serving the React build).
# From this directory:
#   docker compose up -d --build
# .env sets APP_ENV=dev|prod; CMS_BACKEND comes from .env.dev or .env.prod.
# UI: http://localhost
#
# Start the backend stack first (port 8080) so /api proxying works.

name: cms-frontend

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cms-nginx
    restart: unless-stopped
    env_file:
      - .env.${APP_ENV:-dev}
    environment:
      APP_ENV: ${APP_ENV:-dev}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /etc/ssl/dashen:/etc/nginx/ssl:ro,z
    ports:
      - "8084:8080"
      - "443:8443"
