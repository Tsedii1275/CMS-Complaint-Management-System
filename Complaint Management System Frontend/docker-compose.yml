# App server (dbhqcvmsproffesrv): React (Nginx) only.
# Spring Boot is started from ../complaint-management-system/docker-compose.yml.
# MySQL stays on dbhqcvmsprodbesrv (172.24.17.113).
#
# One-time on the app server:
#   docker network create cms
#
# From this directory, with APP_ENV=prod in .env:
#   docker compose up -d --build
# Rebuild only Nginx:
#   docker compose up -d --no-deps --build --force-recreate nginx
#
# UI:  http://localhost:8084  and https://localhost
# API: Nginx forwards /api/ to complaint-management-system:8080 on the cms network.

name: cms-frontend

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cms-nginx
    restart: unless-stopped
    env_file:
      - .env.${APP_ENV:-dev}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      # Docker DNS name of the backend service. Not the database server, and not a host IP.
      CMS_BACKEND: complaint-management-system:8080
    volumes:
      - /etc/ssl/dashen:/etc/nginx/ssl:ro,z
    ports:
      - "8084:8080"
      - "443:8443"
    networks:
      - cms

networks:
  cms:
    name: cms
    external: true
