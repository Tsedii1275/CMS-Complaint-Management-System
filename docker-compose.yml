# Full CMS stack. From this directory:
#   docker compose up -d --build
# App: http://localhost
# phpMyAdmin: http://localhost:8081
#
# Host mvnw + npm start (MySQL only):
#   docker compose up -d mysql phpmyadmin

name: cms

services:
  mysql:
    image: mysql:8.0
    container_name: cms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cms_db
      MYSQL_USER: cms_user
      MYSQL_PASSWORD: cms_pass
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: cms-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy

  complaint-management-system:
    build:
      context: ./complaint-management-system
      dockerfile: Dockerfile
    container_name: cms-complaint-management-system
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: cms_user
      SPRING_DATASOURCE_PASSWORD: cms_pass
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
      SPRING_FLYWAY_OUT_OF_ORDER: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_PUBLIC_BASE_URL: http://localhost
      APP_CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
      FILE_UPLOAD_DIR: /app/uploads
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-this-to-a-long-random-secret}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Admin@Dashen2026!}
    volumes:
      - cms_uploads:/app/uploads
    expose:
      - "8080"

  nginx:
    build:
      context: "./Complaint Management System Frontend"
      dockerfile: Dockerfile
    container_name: cms-nginx
    restart: unless-stopped
    depends_on:
      - complaint-management-system
    ports:
      - "80:80"

volumes:
  mysql_data:
  cms_uploads:
