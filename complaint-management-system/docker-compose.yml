# Backend stack. From this directory:
#   docker compose up -d --build
# .env sets APP_ENV=dev|prod; values come from .env.dev or .env.prod.
# API: http://localhost:8080
# phpMyAdmin (optional): docker compose --profile tools up -d
#
# Host mvnw against this MySQL:
#   docker compose up -d mysql

name: cms-backend

services:
  mysql:
    # Stay on 8.0 until a staged 8.4 LTS cutover. Do not change this tag without backup.
    image: mysql:8.0
    container_name: cms-mysql
    restart: unless-stopped
    env_file:
      - .env.${APP_ENV:-dev}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./hardening.cnf:/opt/hardening.cnf:ro
    entrypoint:
      - bash
      - -ec
      - install -m 644 /opt/hardening.cnf /etc/mysql/conf.d/hardening.cnf && exec docker-entrypoint.sh mysqld
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --ssl-mode=REQUIRED -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    profiles: [tools]
    image: phpmyadmin/phpmyadmin
    container_name: cms-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy

  complaint-management-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cms-complaint-management-system
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.${APP_ENV:-dev}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-cms_db}?sslMode=${MYSQL_SSL_MODE:-REQUIRED}&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
      SPRING_FLYWAY_OUT_OF_ORDER: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      FILE_UPLOAD_DIR: /app/uploads
    volumes:
      - cms_uploads:/app/uploads
    ports:
      - "8080:8080"

volumes:
  mysql_data:
  cms_uploads:
