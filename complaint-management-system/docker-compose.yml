# App server (dbhqcvmsproffesrv): Spring Boot only.
# MySQL stays on dbhqcvmsprodbesrv (172.24.17.113). Nginx is started from the frontend Compose file.
#
# One-time on the app server:
#   docker network create cms
#
# From this directory, with APP_ENV=prod in .env and secrets in .env.prod.local:
#   docker compose up -d --build
# Restart only the API:
#   docker compose up -d --no-deps --force-recreate complaint-management-system
#
# Do not run "docker compose down -v": that deletes the uploads volume.

name: cms-api

services:
  complaint-management-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cms-complaint-management-system
    restart: unless-stopped
    # DNS for this name returns 10.0.20.68, which this server cannot reach. DataPower rejects
    # requests whose hostname is the mapped IP, so the container resolves the name to the NAT.
    extra_hosts:
      - "datapower-cp4iuat.dashenbanksc.com:10.40.30.114"
    env_file:
      - path: .env.${APP_ENV:-dev}
        required: true
      - path: .env.${APP_ENV:-dev}.local
        required: false
    environment:
      APP_ENV: ${APP_ENV:-dev}
      # Remote database server. Do not point this at a MySQL container on the app server.
      # hardening.cnf sets require_secure_transport=ON, so the JDBC connection uses TLS.
      MYSQL_HOST: 172.24.17.113
      MYSQL_PORT: "3306"
      MYSQL_SSL_MODE: REQUIRED
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
      SPRING_FLYWAY_OUT_OF_ORDER: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      FILE_UPLOAD_DIR: /app/uploads
    volumes:
      # Fixed name so a redeploy does not create an empty uploads volume.
      - cms_uploads:/app/uploads
      # Optional DataPower truststore (public Sectigo intermediate only). Create ./certs
      # and set the truststore env vars in .env.prod.local.
      - ./certs:/app/certs:ro,z
    ports:
      - "8082:8080"
    networks:
      - cms

networks:
  cms:
    name: cms
    external: true

volumes:
  cms_uploads:
    name: cms-backend_cms_uploads
