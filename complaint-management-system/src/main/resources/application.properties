spring.application.name=complaint-management-system
# .env files have no properties/yaml extension; [.properties] is required or Spring skips them.
spring.config.import=optional:file:.env[.properties],optional:file:.env.${APP_ENV:dev}[.properties],optional:file:.env.${APP_ENV:dev}.local[.properties]
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:cms_db}?sslMode=${MYSQL_SSL_MODE:REQUIRED}&serverTimezone=UTC&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1.0
spring.flyway.out-of-order=true
spring.flyway.repair-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.flowable.database-schema-update=true
flowable.database-schema-update=true
flowable.check-process-definitions=true

# Customer notifications. Business code calls NotificationService only; the transport
# is chosen here. Providers: email = smtp | log, sms = log | datapower.
# "log" records each message in the notifications table as SKIPPED without delivering it.
# "datapower" sends through Dashen DataPower OAuth2 + SMS/send. Secrets stay in .env.*.local.
notification.enabled=${NOTIFICATION_ENABLED:true}
notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:true}
notification.email.provider=${NOTIFICATION_EMAIL_PROVIDER:log}
notification.email.from=${NOTIFICATION_EMAIL_FROM:}
notification.email.from-name=${NOTIFICATION_EMAIL_FROM_NAME:Customer Service Team}
notification.email.reply-to=${NOTIFICATION_EMAIL_REPLY_TO:}
notification.email.backup-host=${SPRING_MAIL_HOST_BACKUP:}
notification.email.gmail.enabled=${GMAIL_SMTP_ENABLED:false}
notification.email.gmail.host=${GMAIL_SMTP_HOST:smtp.gmail.com}
notification.email.gmail.port=${GMAIL_SMTP_PORT:587}
notification.email.gmail.username=${GMAIL_SMTP_USERNAME:}
notification.email.gmail.password=${GMAIL_SMTP_PASSWORD:}
notification.email.gmail.from=${GMAIL_SMTP_FROM:}
notification.sms.enabled=${NOTIFICATION_SMS_ENABLED:true}
notification.sms.provider=${NOTIFICATION_SMS_PROVIDER:log}
notification.sms.sender-id=${NOTIFICATION_SMS_SENDER_ID:}
notification.sms.default-country-code=${NOTIFICATION_SMS_DEFAULT_COUNTRY_CODE:251}
notification.sms.gateway.base-url=${NOTIFICATION_SMS_GATEWAY_BASE_URL:}
notification.sms.gateway.username=${NOTIFICATION_SMS_GATEWAY_USERNAME:}
notification.sms.gateway.password=${NOTIFICATION_SMS_GATEWAY_PASSWORD:}
notification.sms.gateway.api-key=${NOTIFICATION_SMS_GATEWAY_API_KEY:}
notification.sms.gateway.connect-timeout-ms=${NOTIFICATION_SMS_GATEWAY_CONNECT_TIMEOUT_MS:5000}
notification.sms.gateway.read-timeout-ms=${NOTIFICATION_SMS_GATEWAY_READ_TIMEOUT_MS:10000}
notification.sms.datapower.token-url=${SMS_DATAPOWER_TOKEN_URL:https://datapower-cp4iuat.dashenbanksc.com:9443/dashen-bank/sandbox/oauth19/oauth2/token}
notification.sms.datapower.send-url=${SMS_DATAPOWER_SEND_URL:https://datapower-cp4iuat.dashenbanksc.com:9443/dashen-bank/sandbox/SMS/send}
notification.sms.datapower.fallback-token-url=${SMS_DATAPOWER_FALLBACK_TOKEN_URL:}
notification.sms.datapower.fallback-send-url=${SMS_DATAPOWER_FALLBACK_SEND_URL:}
notification.sms.datapower.ssl-peer-name=${SMS_DATAPOWER_SSL_PEER_NAME:datapower-cp4iuat.dashenbanksc.com}
notification.sms.datapower.client-id=${SMS_DATAPOWER_CLIENT_ID:}
notification.sms.datapower.client-secret=${SMS_DATAPOWER_CLIENT_SECRET:}
notification.sms.datapower.scope=${SMS_DATAPOWER_SCOPE:DASHEN}
notification.sms.datapower.send-for=${SMS_DATAPOWER_SEND_FOR:Voice Management}
notification.sms.datapower.phone-format=${SMS_DATAPOWER_PHONE_FORMAT:LOCAL_09}
notification.sms.datapower.allowed-local-prefixes=${SMS_DATAPOWER_ALLOWED_LOCAL_PREFIXES:09}
notification.sms.datapower.connect-timeout-ms=${SMS_DATAPOWER_CONNECT_TIMEOUT_MS:5000}
notification.sms.datapower.read-timeout-ms=${SMS_DATAPOWER_READ_TIMEOUT_MS:10000}
notification.sms.datapower.token-refresh-skew-seconds=${SMS_DATAPOWER_TOKEN_REFRESH_SKEW_SECONDS:60}
notification.sms.datapower.truststore-path=${SMS_DATAPOWER_TRUSTSTORE_PATH:}
notification.sms.datapower.truststore-password=${SMS_DATAPOWER_TRUSTSTORE_PASSWORD:}
notification.retry.max-attempts=${NOTIFICATION_RETRY_MAX_ATTEMPTS:5}
notification.retry.initial-delay-seconds=${NOTIFICATION_RETRY_INITIAL_DELAY_SECONDS:60}
notification.retry.multiplier=${NOTIFICATION_RETRY_MULTIPLIER:5}
notification.retry.max-delay-seconds=${NOTIFICATION_RETRY_MAX_DELAY_SECONDS:7200}
notification.dispatcher.enabled=${NOTIFICATION_DISPATCHER_ENABLED:true}
notification.dispatcher.poll-interval-ms=${NOTIFICATION_DISPATCHER_POLL_INTERVAL_MS:30000}
notification.dispatcher.initial-delay-ms=${NOTIFICATION_DISPATCHER_INITIAL_DELAY_MS:30000}
notification.dispatcher.batch-size=${NOTIFICATION_DISPATCHER_BATCH_SIZE:50}
notification.dispatcher.core-pool-size=${NOTIFICATION_DISPATCHER_CORE_POOL_SIZE:2}
notification.dispatcher.max-pool-size=${NOTIFICATION_DISPATCHER_MAX_POOL_SIZE:4}
notification.dispatcher.queue-capacity=${NOTIFICATION_DISPATCHER_QUEUE_CAPACITY:500}
notification.dispatcher.stale-after-seconds=${NOTIFICATION_DISPATCHER_STALE_AFTER_SECONDS:300}
notification.templates.location=${NOTIFICATION_TEMPLATES_LOCATION:classpath:notification/templates/}

# SMTP: SPRING_MAIL_HOST is the bank mail server (192.168.0.145), optional SPRING_MAIL_HOST_BACKUP (192.168.0.146).
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_READ_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_WRITE_TIMEOUT_MS:10000}

# Complaint evidence: 10MB file + multipart overhead. Rechecked in FileSecurityService.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ClamAV Security Scanner Settings
clamav.host=${CLAMAV_HOST:127.0.0.1}
clamav.port=${CLAMAV_PORT:3310}
clamav.timeout-ms=${CLAMAV_TIMEOUT_MS:3000}
clamav.fail-closed=${CLAMAV_FAIL_CLOSED:true}

# Bootstrap Admin Configuration — INITIAL_ADMIN_PASSWORD is required (no default)
app.admin.initial-password=${INITIAL_ADMIN_PASSWORD}

# JWT — APP_JWT_SECRET is required (no default; startup fails if missing)
app.jwtSecret=${APP_JWT_SECRET}
app.jwtExpirationMs=${APP_JWT_EXPIRATION_MS:900000}
info.app.version=${APP_VERSION:0.0.1-SNAPSHOT}

security.lockout-threshold=${LOCKOUT_THRESHOLD:6}
security.lockout-duration-minutes=${LOCKOUT_DURATION_MINUTES:30}
security.mfa-ready=${MFA_READY:true}
security.jwt-issuer=${JWT_ISSUER:dashenbank-cms}

# Browser-facing origin for email/SMS links (not Tomcat, not SSL keystore)
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:3000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
server.forward-headers-strategy=framework

# Oracle CBS customer profile lookup uses CBS_DATASOURCE_* only (FCUBUAT for now).
# INSIGHT is recorded below for later use and is not wired to the lookup.
cbs.datasource.url=${CBS_DATASOURCE_URL:${CBS_DB_URL:}}
cbs.datasource.username=${CBS_DATASOURCE_USERNAME:${CBS_DB_USERNAME:}}
cbs.datasource.password=${CBS_DATASOURCE_PASSWORD:${CBS_DB_PASSWORD:}}
cbs.datasource.driver-class-name=${CBS_DATASOURCE_DRIVER:oracle.jdbc.OracleDriver}
cbs.table-name=${CBS_TABLE_NAME:${CBS_CUSTOMER_PROFILE_TABLE:FCUBSLIVE.RTVSCBS_CUST_PROFILE}}
cbs.query-timeout-seconds=${CBS_QUERY_TIMEOUT_SECONDS:8}
cbs.connect-timeout-ms=${CBS_CONNECT_TIMEOUT_MS:5000}
# Exact RTVSCBS_CUST_PROFILE column names
cbs.columns.customer-name=${CBS_COL_CUSTOMER_NAME:CUSTOMER_NAME}
cbs.columns.phone-number=${CBS_COL_PHONE_NUMBER:${CBS_COL_REGISTERED_PHONE:REGISTERED_PHONE}}
cbs.columns.home-branch=${CBS_COL_HOME_BRANCH:${CBS_COL_BRANCH_NAME:BRANCH_NAME}}
cbs.columns.branch-code=${CBS_COL_BRANCH_CODE:BRANCH_CODE}
cbs.columns.home-district=${CBS_COL_HOME_DISTRICT:${CBS_COL_DISTRICT_NAME:DISTRICT_NAME}}
cbs.columns.customer-segment=${CBS_COL_CUSTOMER_SEGMENT:${CBS_COL_CUST_SEGMENT:CUST_SEGMENT}}
cbs.columns.account-number=${CBS_COL_ACCOUNT_NUMBER:${CBS_COL_ACCOUNT_NO:ACCOUNT_NUMBER}}

# Hybrid AD/LDAP. Bind password stays in gitignored .env.${APP_ENV}.local
ldap.enabled=${LDAP_ENABLED:false}
ldap.url=${LDAP_URL:ldap://S-HOF-ADC-01.dashenbank.local:389}
ldap.fallback-url=${LDAP_FALLBACK_URL:ldap://S-HOF-ADC-01.dashenbank.local:389}
ldap.bind-dn=${LDAP_BIND_DN:CN=CASHCOMP,OU=Service User,OU=Dashen Head Office,OU=Dashen Bank,DC=dashenbank,DC=local}
ldap.bind-password=${LDAP_BIND_PASSWORD:}
ldap.base-dn=${LDAP_BASE_DN:DC=dashenbank,DC=local}
ldap.user-search-base=${LDAP_USER_SEARCH_BASE:DC=dashenbank,DC=local}
ldap.user-search-filter=${LDAP_USER_SEARCH_FILTER:(&(objectClass=user)(!(objectClass=computer))(|(sAMAccountName={0})(userPrincipalName={0})(mail={0})))}
ldap.group-search-base=${LDAP_GROUP_SEARCH_BASE:OU=Dashen Bank,DC=dashenbank,DC=local}
ldap.domain=${LDAP_DOMAIN:dashenbank.local}
ldap.ssl-peer-name=${LDAP_SSL_PEER_NAME:ldap.dashenbank.local}
ldap.connect-timeout-ms=${LDAP_CONNECT_TIMEOUT_MS:5000}
ldap.read-timeout-ms=${LDAP_READ_TIMEOUT_MS:10000}
ldap.role-priority=${LDAP_ROLE_PRIORITY:TITLE_THEN_GROUP}
ldap.title-mappings=${LDAP_TITLE_MAPPINGS:}
ldap.group-mappings=${LDAP_GROUP_MAPPINGS:}
ldap.work-unit.branch-titles=${LDAP_WORK_UNIT_BRANCH_TITLES:Branch Manager,Senior Branch Manager,Acting Branch Manager,Customer Service Manager,Senior Customer Service Manager,Acting Customer Service Manager,Service Manager,CSM,Branch Operations Manager,IFB Manager}
ldap.work-unit.head-office-titles=${LDAP_WORK_UNIT_HEAD_OFFICE_TITLES:Director,Department Director,Senior Manager,Acting Senior Manager,Manager,Department Manager,Head of Department,Division Head}
ldap.work-unit.district-titles=${LDAP_WORK_UNIT_DISTRICT_TITLES:District Director,District Business Director,Operational Manager,District Manager}
ldap.truststore-path=${LDAP_TRUSTSTORE_PATH:}
ldap.truststore-password=${LDAP_TRUSTSTORE_PASSWORD:changeit}
ldap.trust-all=${LDAP_TRUST_ALL:true}
ldap.host=${LDAP_HOST:S-HOF-ADC-01.dashenbank.local}
ldap.host-ip=${LDAP_HOST_IP:}
ldap.extra-host=${LDAP_EXTRA_HOST:}
ldap.sync.enabled=${LDAP_SYNC_ENABLED:true}
ldap.sync.cron=${LDAP_SYNC_CRON:0 0 1 * * ?}
ldap.sync.discovery=${LDAP_SYNC_DISCOVERY:false}
ldap.sync.max-results=${LDAP_SYNC_MAX_RESULTS:500}
ldap.sync.page-size=${LDAP_SYNC_PAGE_SIZE:500}

logging.level.com.zaxxer.hikari.HikariConfig=WARN
logging.level.com.zaxxer.hikari.pool.HikariPool=WARN