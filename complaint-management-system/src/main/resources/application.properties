spring.application.name=complaint-management-system
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:cms_db}?sslMode=${MYSQL_SSL_MODE:DISABLED}&serverTimezone=UTC&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cms_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cms_pass}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1.0
spring.flyway.out-of-order=true
spring.flyway.locations=classpath:db/migration

spring.flowable.database-schema-update=true
flowable.database-schema-update=true
flowable.check-process-definitions=true

# SMTP for real-time email notifications
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tsediteka1@gmail.com
spring.mail.password=peusflfbsxquqwon

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# File Upload configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

