# Customer notification templates (Amharic). UTF-8.
# Same keys and placeholders as messages_en.properties.
# Email and SMS use the same body.

registration.email.subject=የቅሬታ ምዝገባ ማረጋገጫ
registration.email.body=ውድ {customerName}፣\n\n\
በ {submissionDate} በ {submissionTime} ያቀረቡት ቅሬታ በተሳካ ሁኔታ ተመዝግቧል።\n\n\
የቲኬት ቁጥር: {ticketId}\n\n\
ቅሬታዎ በአሁኑ ጊዜ እየተገመገመ ይገኛል። ከላይ ያለውን የቲኬት ቁጥር በመጠቀም ሂደቱን መከታተል ይችላሉ።\n\n\
ዳሽን ባንክን ስላነጋገሩ እናመሰግናለን።\n\n\
ዳሽን ባንክ\n\
የደንበኞች አገልግሎት ቡድን

resolution.email.subject=የቅሬታ መፍትሄ መረጃ
resolution.email.body=ውድ {customerName}፣\n\n\
በ {submissionDate} ያቀረቡት ቅሬታ ({ticketId}) መፍትሄ አግኝቷል።\n\n\
የመፍትሄ ማጠቃለያ:\n\
{resolutionSummary}\n\n\
የተፈታበት ቀን:\n\
{resolutionDate}\n\n\
የእርስዎ ተሞክሮ ለእኛ አስፈላጊ ነው።\n\n\
እባክዎን ከታች ያለውን ሊንክ በመጠቀም በአገልግሎታችን ላይ ያለዎትን እርካታ ይመዝኑ:\n\n\
{feedbackLink}\n\n\
አገልግሎታችንን እንድናሻሽል ስለረዱን እናመሰግናለን።\n\n\
ዳሽን ባንክ\n\
የደንበኞች አገልግሎት ቡድን
