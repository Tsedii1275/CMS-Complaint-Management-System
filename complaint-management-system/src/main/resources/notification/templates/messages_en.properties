# Customer notification templates (English). UTF-8.
# Keys: <event>.email.subject, <event>.email.body
# Email and SMS use the same body. SMS has no subject.
# Placeholders: {customerName} {ticketId} {submissionDate} {submissionTime}
#               {resolutionDate} {resolutionSummary} {feedbackLink}
# Override the whole directory with NOTIFICATION_TEMPLATES_LOCATION=file:/path/

registration.email.subject=Complaint Registration Confirmation
registration.email.body=Dear {customerName},\n\n\
Your complaint submitted on {submissionDate} at {submissionTime} has been successfully registered.\n\n\
Ticket ID: {ticketId}\n\n\
Your complaint is currently under review. You may track its progress using the ticket ID above.\n\n\
Thank you for contacting Dashen Bank.\n\n\
Dashen Bank\n\
Customer Care Team

resolution.email.subject=Complaint Resolution Update
resolution.email.body=Dear {customerName},\n\n\
Your complaint ({ticketId}) submitted on {submissionDate} has been resolved.\n\n\
Resolution:\n\
{resolutionSummary}\n\n\
Resolution Date:\n\
{resolutionDate}\n\n\
Your experience matters to us.\n\n\
Please take a moment to rate your satisfaction with our service using the link below:\n\n\
{feedbackLink}\n\n\
Thank you for helping us improve our services.\n\n\
Dashen Bank\n\
Customer Care Team
